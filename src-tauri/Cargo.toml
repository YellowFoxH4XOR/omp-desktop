[package]
name = "pidesk"
version = "0.1.0"
description = "πDesk — a local desktop app for Pi coding-agent sessions"
edition = "2021"

[lib]
name = "pidesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "sync", "time", "fs"] }
rusqlite = { version = "0.40", features = ["bundled"] }
notify = "8"
uuid = { version = "1", features = ["v4"] }
trash = "5"
parking_lot = "0.12"
libc = "0.2"
portable-pty = "0.9"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
